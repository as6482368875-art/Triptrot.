<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TROTTRIP - 3탭 초심플 모바일 프로토타입</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --cream-bg: #FDFBF3;
      --cream-card: #F8F4E6;
      --cream-border: #ECE3C8;
      --forsythia: #FFE135;       /* 개나리 옐로우 */
      --forsythia-warm: #F5C330;  /* 진한 개나리 골드 */
      --trot-brown: #4A2E1B;      /* 로고 및 배너 딥브라운 */
      --trot-dark: #2C1D12;       /* 하단 결제창 다크브라운 */
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #E9E5D8;
      color: var(--trot-brown);
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* PPT 캡처용 아이폰 프레임 (모바일 접속 시에는 꽉 찬 화면) */
    .phone-mockup {
      width: 385px;
      height: 785px;
      background-color: var(--cream-bg);
      border-radius: 48px;
      border: 11px solid #231F20;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.28), inset 0 0 0 2px #555;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    @media (max-width: 440px) {
      body { background-color: var(--cream-bg); }
      .phone-mockup {
        width: 100vw;
        height: 100dvh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .iphone-notch {
      width: 132px;
      height: 22px;
      background-color: #231F20;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
    }

    /* TROTTRIP 영문 커스텀 로고 (O 안에 음표) */
    .logo-text {
      font-weight: 900;
      font-size: 2.05rem;
      letter-spacing: -0.03em;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }
    .logo-o-circle {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background-color: var(--trot-brown);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      margin: 0 1px;
    }

    .btn-bounce:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-0 sm:p-4">

  <!-- PC에서 PPT 캡처할 때 편한 상단 전환 바 (폰 바깥) -->
  <div class="hidden sm:flex items-center gap-2 mb-3 bg-white/90 px-4 py-2 rounded-full shadow-sm border border-[#DCD4C0] text-xs font-black text-[#4A2E1B]">
    <span>📸 PPT 캡처용 3탭 전환:</span>
    <button onclick="switchTab('home')" class="px-3.5 py-1 rounded-full bg-[#FFE135] text-[#2C1D12]">1. 공연·맛집 (홈)</button>
    <button onclick="switchTab('package')" class="px-3.5 py-1 rounded-full bg-[#4A2E1B] text-[#FFE135]">2. 바로예약 (Basic/Premium)</button>
    <button onclick="switchTab('club')" class="px-3.5 py-1 rounded-full bg-[#F8F4E6] border">3. 팬클럽단체</button>
  </div>

  <!-- ================= 스마트폰 전체 화면 프레임 ================= -->
  <div class="phone-mockup">

    <!-- 아이폰 노치 & 상단 상태바 -->
    <div class="iphone-notch hidden sm:block"></div>
    <div class="px-6 pt-2.5 pb-1 flex justify-between items-center text-[12px] font-extrabold text-[#231F20] shrink-0">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-signal text-[10px]"></i>
        <i class="fa-solid fa-wifi text-[10px]"></i>
        <i class="fa-solid fa-battery-full text-sm"></i>
      </div>
    </div>

    <!-- 1. 상단 TROTTRIP 로고 헤더 -->
    <header class="px-4 py-1.5 flex items-center justify-between shrink-0">
      <button onclick="switchTab('home')" class="w-7 h-7 flex items-center justify-center text-[#4A2E1B] text-lg font-black">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      
      <div onclick="switchTab('home')" class="cursor-pointer logo-text select-none">
        <span class="text-[#4A2E1B]">TR</span>
        <span class="logo-o-circle"><i class="fa-solid fa-music text-[13px]"></i></span>
        <span class="text-[#4A2E1B]">T</span>
        <span class="text-[#F5B727] ml-0.5">TRIP</span>
      </div>

      <button onclick="openMyModal()" class="relative w-7 h-7 flex items-center justify-center text-[#4A2E1B]">
        <i class="fa-solid fa-receipt text-base"></i>
        <span id="badge-count" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">1</span>
      </button>
    </header>

    <!-- 🔥 2. 초심플 3개 메뉴 탭 바 (1.공연·맛집 / 2.바로예약 / 3.팬클럽단체) -->
    <div class="px-3.5 shrink-0">
      <div class="bg-[#F8F4E6] p-1.5 rounded-2xl border border-[#ECE3C8] grid grid-cols-3 gap-1.5 text-center">
        <button onclick="switchTab('home')" id="top-home" class="py-2 rounded-xl bg-[#FFE135] text-[#2C1D12] font-black text-xs flex items-center justify-center gap-1.5 shadow-2xs">
          <i class="fa-solid fa-star text-sm"></i>
          <span>1. 공연·맛집</span>
        </button>
        <button onclick="switchTab('package')" id="top-package" class="py-2 rounded-xl text-[#8C8273] font-extrabold text-xs flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-bus text-sm"></i>
          <span>2. 바로예약</span>
        </button>
        <button onclick="switchTab('club')" id="top-club" class="py-2 rounded-xl text-[#8C8273] font-extrabold text-xs flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-users text-sm"></i>
          <span>3. 팬클럽단체</span>
        </button>
      </div>
    </div>

    <!-- ================= 3. 중앙 메인 화면 ================= -->
    <main class="px-3.5 py-2 flex-1 flex flex-col justify-between overflow-hidden">

      <!-- =========================================================================
           [탭 1: 공연·맛집 (홈) — 한 문장 슬로건 + 가수선택 + 공연·맛집 미리보기 + 바로예약 버튼]
           ========================================================================= -->
      <section id="view-home" class="h-full flex flex-col justify-between space-y-2">
        
        <!-- ① 짙은 브라운 배너 (딱 한 문장!) -->
        <div class="bg-[#46331F] text-white px-4 py-3 rounded-2xl shadow-sm space-y-1.5 shrink-0">
          <div class="flex items-center gap-1.5">
            <span class="bg-[#F5C330] text-[#2C1D12] text-[10px] font-black px-2.5 py-0.5 rounded-full">팬카페 미가입자 환영</span>
            <span class="bg-white/20 text-white text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">1~2인 샤이 시니어 전용</span>
          </div>
          <h1 class="text-[16px] font-black tracking-tight leading-snug">
            혼자, 친구끼리도 편하게 떠나는 원정투어!
          </h1>
        </div>

        <!-- ② 가수별 맞춤 투어 선택 -->
        <div class="bg-white p-3 rounded-2xl border border-[#ECE3C8] shadow-2xs shrink-0">
          <div class="flex justify-between items-center mb-2 px-0.5">
            <span class="text-xs font-black text-[#2C1D12]">가수별 맞춤 투어 (터치)</span>
            <span id="home-duration-pill" onclick="cycleDuration()" class="cursor-pointer bg-[#FFF5C0] text-[#4A2E1B] border border-[#F5C330] text-[10px] font-black px-2.5 py-0.5 rounded-full">
              📅 당일형 (클릭시 1박2일/2박3일)
            </span>
          </div>

          <div class="grid grid-cols-4 gap-2">
            <button onclick="selectSinger('임영웅')" id="sbtn-임영웅" class="btn-bounce py-2.5 px-1 rounded-2xl bg-[#FFE135] border-2 border-[#E5B800] flex flex-col items-center gap-1 shadow-2xs">
              <span class="text-2xl leading-none">👑</span>
              <span class="font-black text-xs text-[#2C1D12]">임영웅</span>
            </button>
            <button onclick="selectSinger('이찬원')" id="sbtn-이찬원" class="btn-bounce py-2.5 px-1 rounded-2xl bg-[#F8F4E6] border border-[#ECE3C8] flex flex-col items-center gap-1">
              <span class="text-2xl leading-none">⭐</span>
              <span class="font-extrabold text-xs text-[#2C1D12]">이찬원</span>
            </button>
            <button onclick="selectSinger('장민호')" id="sbtn-장민호" class="btn-bounce py-2.5 px-1 rounded-2xl bg-[#F8F4E6] border border-[#ECE3C8] flex flex-col items-center gap-1">
              <span class="text-2xl leading-none">🦌</span>
              <span class="font-extrabold text-xs text-[#2C1D12]">장민호</span>
            </button>
            <button onclick="selectSinger('영탁')" id="sbtn-영탁" class="btn-bounce py-2.5 px-1 rounded-2xl bg-[#F8F4E6] border border-[#ECE3C8] flex flex-col items-center gap-1">
              <span class="text-2xl leading-none">🥂</span>
              <span class="font-extrabold text-xs text-[#2C1D12]">영탁</span>
            </button>
          </div>
        </div>

        <!-- ③ 메인 콘서트 포스터 + 포함 맛집 코스 한 줄 요약 + 바로 예약 대형 버튼 -->
        <div class="bg-white p-3 rounded-2xl border border-[#ECE3C8] shadow-2xs flex-1 flex flex-col justify-between">
          <!-- 콘서트 배너 이미지 -->
          <div class="relative h-36 w-full rounded-xl overflow-hidden bg-[#1B2A4A]">
            <img id="home-poster-img" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&auto=format&fit=crop&q=80" class="w-full h-full object-cover opacity-85" alt="콘서트" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-transparent"></div>

            <div class="absolute bottom-2.5 left-3 right-3 text-white">
              <span id="home-venue-badge" class="bg-[#FFE135] text-[#2C1D12] text-[10px] font-black px-2 py-0.5 rounded">
                고양종합운동장
              </span>
              <h2 id="home-concert-title" class="text-lg font-black leading-tight mt-1">
                2026 임영웅 콘서트
              </h2>
              <div class="flex justify-between items-center mt-0.5 text-[11px] font-bold">
                <span id="home-concert-date" class="text-gray-200">📅 11.14(토) 17시</span>
                <span id="home-concert-price" class="text-[#FFE135] font-black">투어 실결제 49,000원 (티켓별도)</span>
              </div>
            </div>
          </div>

          <!-- 가수 추천 맛집·성지 코스 핵심 요약 바 -->
          <div class="bg-[#FDFBF3] px-3 py-2 rounded-xl border border-[#ECE3C8] flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 min-w-0">
              <span class="bg-[#FF66C4] text-white text-[10px] font-black px-2 py-0.5 rounded shrink-0">포함코스</span>
              <span id="home-food-summary" class="font-extrabold text-[#2C1D12] truncate">일산 한우갈비 ➔ 호수공원 성지카페</span>
            </div>
            <button onclick="cycleCourseTheme()" class="text-[10px] font-black text-[#4A2E1B] underline shrink-0 ml-1">코스변경↻</button>
          </div>

          <!-- 사용자가 헷갈리지 않고 바로 누르는 원스톱 예약 진입 버튼 -->
          <div class="grid grid-cols-3 gap-2">
            <button onclick="showToast('✅ 보유 티켓 간편 인증 완료!'); switchTab('package');" class="btn-bounce py-3 rounded-xl bg-[#46331F] text-[#FFE135] font-black text-xs flex items-center justify-center gap-1 shadow-xs">
              <i class="fa-solid fa-ticket"></i>
              <span>티켓인증</span>
            </button>

            <button onclick="switchTab('package')" class="col-span-2 btn-bounce py-3 rounded-xl bg-[#FFE135] text-[#2C1D12] border-2 border-[#E5B800] font-black text-sm flex items-center justify-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-bus"></i>
              <span>이 투어 바로 예약하기 ➔</span>
            </button>
          </div>
        </div>

      </section>


      <!-- =========================================================================
           [탭 2: 바로예약 — 사진 2번과 100% 동일! (Basic 가이드 제외·대량인원 / Premium만 가이드 선택)]
           ========================================================================= -->
      <section id="view-package" class="h-full flex flex-col justify-between space-y-2 hidden">
        
        <!-- ① 상단 [기본 (보조금 특가)] vs [프리미엄 (효도선물)] 스위치 탭 -->
        <div class="bg-[#F4EFE0] p-1.5 rounded-2xl border border-[#ECE3C8] grid grid-cols-2 gap-1.5 shrink-0">
          <button onclick="selectPkgMode('basic')" id="pkg-tab-basic" class="btn-bounce py-2 px-3 rounded-xl bg-white text-[#2C1D12] flex items-center gap-2 text-left shadow-2xs">
            <i class="fa-solid fa-bus text-gray-500 text-base"></i>
            <div>
              <div class="text-[11px] font-black leading-none">기본 (보조금 특가)</div>
              <div id="tab-basic-price" class="text-[10px] font-black text-rose-600 mt-0.5">실결제 49,000원</div>
            </div>
          </button>

          <button onclick="selectPkgMode('premium')" id="pkg-tab-premium" class="btn-bounce py-2 px-3 rounded-xl bg-[#F5C330] text-[#2C1D12] flex items-center gap-2 text-left shadow-xs border border-[#D9A310]">
            <i class="fa-solid fa-car-side text-[#2C1D12] text-base"></i>
            <div>
              <div class="text-[11px] font-black leading-none">프리미엄 (효도선물)</div>
              <div id="tab-prem-price" class="text-[10px] font-extrabold text-[#2C1D12] mt-0.5">1인 240,000원</div>
            </div>
          </button>
        </div>

        <!-- ② 중앙 구성 설명 박스 (프리미엄은 로컬가이드 선택 가능 / 기본은 로컬가이드 완전 제거!) -->
        <div id="pkg-center-card" class="bg-white p-3.5 rounded-2xl border-2 border-[#F5C330] flex-1 flex flex-col justify-between">
          <!-- JS 렌더링 -->
        </div>

        <!-- ③ 하단 출발지·인원 선택 & 다크브라운 예약확정 & 노란색 효도선물 카톡 버튼 -->
        <div class="bg-white p-3 rounded-2xl border border-[#CED4DA] space-y-2 shrink-0">
          <div class="grid grid-cols-2 gap-2">
            <select id="pkg-origin-select" class="px-2.5 py-2 rounded-xl bg-[#FDFBF3] border border-[#E2D9C0] text-xs font-black text-[#2C1D12]">
              <option value="진주·경남 출발">🚌 진주·경남 출발</option>
              <option value="부산·울산 출발">🚌 부산·울산 출발</option>
              <option value="서울·경기 출발">🚌 서울·경기 출발</option>
              <option value="대구·경북 출발">🚌 대구·경북 출발</option>
            </select>

            <div class="flex items-center justify-between bg-[#FDFBF3] rounded-xl border border-[#E2D9C0] px-3 py-1.5">
              <span class="text-xs font-extrabold text-[#6C6358]">인원</span>
              <div class="flex items-center gap-2">
                <button onclick="changePax(-1)" class="w-6 h-6 rounded-full bg-white border border-gray-300 font-black text-xs text-[#2C1D12]">-</button>
                <span id="pkg-pax-text" class="font-black text-xs text-[#2C1D12]">2명</span>
                <button onclick="changePax(1)" class="w-6 h-6 rounded-full bg-[#F5C330] font-black text-xs text-[#2C1D12]">+</button>
              </div>
            </div>
          </div>

          <div class="bg-[#2C1D12] text-white px-4 py-2.5 rounded-xl flex justify-between items-center">
            <div>
              <div id="pkg-summary-label" class="text-[11px] font-extrabold text-gray-200">Premium(효도컨시어지) 2인</div>
              <div id="pkg-total-price" class="text-xl font-black text-[#F5C330] leading-tight">480,000 원</div>
            </div>
            <button onclick="confirmBooking()" class="btn-bounce px-4 py-2.5 rounded-xl bg-[#FFE135] text-[#2C1D12] font-black text-sm shadow">
              예약확정
            </button>
          </div>

          <button onclick="sendKakaoGift()" class="btn-bounce w-full py-2.5 rounded-xl bg-[#FFE135] text-[#191919] font-black text-xs flex items-center justify-center gap-1.5 shadow-2xs">
            <i class="fa-solid fa-comment text-[#2C1D12]"></i>
            <span>💝 자녀에게 ‘효도선물 결제 링크’ 카카오톡 보내기</span>
          </button>
        </div>

      </section>


      <!-- =========================================================================
           [탭 3: 팬클럽단체 — 일반회원 간편신청 & 총무 명단/입금 관리]
           ========================================================================= -->
      <section id="view-club" class="h-full flex flex-col justify-between space-y-2 hidden">
        <div class="bg-[#2C1D12] text-white p-3 rounded-2xl flex justify-between items-center shrink-0">
          <div>
            <span class="bg-[#FFE135] text-[#2C1D12] text-[10px] font-black px-2 py-0.5 rounded-full">팬클럽 단체 원정</span>
            <h3 class="text-sm font-black mt-1">지부 총무 개설 & 일반회원 신청</h3>
          </div>
          <div class="bg-white/15 p-1 rounded-xl flex gap-1 text-[10px] font-black">
            <button onclick="setClubMode('member')" id="cmode-member" class="px-2.5 py-1.5 rounded-lg bg-[#FFE135] text-[#2C1D12]">회원신청</button>
            <button onclick="setClubMode('mgr')" id="cmode-mgr" class="px-2.5 py-1.5 rounded-lg text-white">총무관리</button>
          </div>
        </div>

        <div id="club-content-box" class="bg-white p-3.5 rounded-2xl border border-[#ECE3C8] flex-1 flex flex-col justify-between"></div>
      </section>

    </main>

    <!-- 🔥 4. 하단 고정 내비게이션 바 (심플하게 3개 탭으로 통일!) -->
    <nav class="bg-white border-t border-[#ECE3C8] px-4 py-2 grid grid-cols-3 text-center shrink-0">
      <button onclick="switchTab('home')" id="bnav-home" class="flex flex-col items-center gap-0.5 text-[#2C1D12] font-black">
        <i class="fa-solid fa-star text-base"></i>
        <span class="text-[11px]">공연·맛집</span>
      </button>
      <button onclick="switchTab('package')" id="bnav-package" class="flex flex-col items-center gap-0.5 text-[#9A9283] font-bold">
        <i class="fa-solid fa-bus text-base"></i>
        <span class="text-[11px]">바로예약</span>
      </button>
      <button onclick="switchTab('club')" id="bnav-club" class="flex flex-col items-center gap-0.5 text-[#9A9283] font-bold">
        <i class="fa-solid fa-users text-base"></i>
        <span class="text-[11px]">팬클럽단체</span>
      </button>
    </nav>

    <!-- [모달] 내 예약함 -->
    <div id="my-modal" class="absolute inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
      <div class="bg-[#FDFBF3] w-full rounded-3xl p-5 space-y-3 border-2 border-[#F5C330] shadow-2xl">

    let bookings = [

    // ================= 2. 3개 탭 전환 =================
    const TABS = ['home', 'package', 'club'];
    function switchTab(tab) {
      TABS.forEach(t => {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('top-' + t).className = (t === tab)
          ? 'py-2 rounded-xl bg-[#FFE135] text-[#2C1D12] font-black text-xs flex items-center justify-center gap-1.5 shadow-2xs'
          : 'py-2 rounded-xl text-[#8C8273] font-extrabold text-xs flex items-center justify-center gap-1.5';

          ? 'flex flex-col items-center gap-0.5 text-[#2C1D12] font-black'
          : 'flex flex-col items-center gap-0.5 text-[#9A9283] font-bold';
      });
      renderAll();
    }

    // ================= 3. 가수 · 기간 · 코스 변경 =================
    function selectSinger(name) {
      curSinger = name;
      curThemeIdx = 0;
      ['임영웅', '이찬원', '장민호', '영탁'].forEach(s => {
        const btn = document.getElementById('sbtn-' + s);
        btn.className = (s === name)
          ? 'btn-bounce py-2.5 px-1 rounded-2xl bg-[#FFE135] border-2 border-[#E5B800] flex flex-col items-center gap-1 shadow-2xs'

      });

      const d = SINGER_DATA[name];
      document.getElementById('home-poster-img').src = d.poster;
      document.getElementById('home-venue-badge').innerText = d.venue;
      document.getElementById('home-concert-title').innerText = d.title;
      document.getElementById('home-concert-date').innerText = `📅 ${d.date}`;
      document.getElementById('home-food-summary').innerText = d.themes[0];
      renderAll();
    }

    function cycleDuration() {
      curDuration = curDuration === '당일형' ? '1박 2일' : curDuration === '1박 2일' ? '2박 3일' : '당일형';
      const basicUnit = curDuration === '당일형' ? 49000 : curDuration === '1박 2일' ? 139000 : 229000;
      document.getElementById('home-duration-pill').innerText = `📅 ${curDuration} (클릭시 1박2일/2박3일)`;
      document.getElementById('home-concert-price').innerText = `투어 실결제 ${basicUnit.toLocaleString()}원 (${curDuration})`;
      renderAll();
      showToast(`📅 여행 기간이 [${curDuration}]으로 변경되었습니다!`);
    }

    function cycleCourseTheme() {
      const d = SINGER_DATA[curSinger];
      curThemeIdx = (curThemeIdx + 1) % d.themes.length;
      document.getElementById('home-food-summary').innerText = d.themes[curThemeIdx];
      showToast(`🪄 포함 코스가 [${d.themes[curThemeIdx]}]로 변경되었습니다!`);
    }

    // ================= 4. 바로예약 탭 (Basic은 로컬가이드 완전 제외 / Premium만 로컬가이드 선택) =================
    function selectPkgMode(mode) {
      curPkgMode = mode;
      if (mode === 'premium' && curPax > 6) curPax = 2;
      renderPackageView();
    }

    function changeGuide() {
      curGuideIdx = (curGuideIdx + 1) % GUIDES_LIST.length;
      renderPackageView();
      showToast(`🧑‍✈️ 전담 로컬가이드가 [${GUIDES_LIST[curGuideIdx]}]로 변경되었습니다.`);
    }

    function renderPackageView() {
      const isPrem = curPkgMode === 'premium';
      const basicUnit = curDuration === '당일형' ? 49000 : curDuration === '1박 2일' ? 139000 : 229000;
      const premUnit = curDuration === '당일형' ? 240000 : curDuration === '1박 2일' ? 340000 : 440000;

      document.getElementById('tab-basic-price').innerText = `실결제 ${basicUnit.toLocaleString()}원`;
      document.getElementById('tab-prem-price').innerText = `1인 ${premUnit.toLocaleString()}원`;

      document.getElementById('pkg-tab-basic').className = !isPrem
        ? 'btn-bounce py-2 px-3 rounded-xl bg-[#F5C330] text-[#2C1D12] flex items-center gap-2 text-left shadow-xs border border-[#D9A310]'
        : 'btn-bounce py-2 px-3 rounded-xl bg-white text-[#2C1D12] flex items-center gap-2 text-left shadow-2xs';

      document.getElementById('pkg-tab-premium').className = isPrem
        ? 'btn-bounce py-2 px-3 rounded-xl bg-[#F5C330] text-[#2C1D12] flex items-center gap-2 text-left shadow-xs border border-[#D9A310]'
        : 'btn-bounce py-2 px-3 rounded-xl bg-white text-[#2C1D12] flex items-center gap-2 text-left shadow-2xs';

      const card = document.getElementById('pkg-center-card');

      if (isPrem) {
        // 사진 2번과 동일한 프리미엄 구성 + 청년 로컬가이드 선택 유지
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="bg-[#46331F] text-[#FFE135] text-[11px] font-black px-3 py-1 rounded-full">
              3040 자녀 효도선물 1위
            </span>
            <span class="text-xs font-black text-rose-700">1인 ${premUnit.toLocaleString()}원 (티켓별도)</span>
          </div>

          <div class="bg-[#F9F8F3] p-3 rounded-2xl border border-[#ECE3C8] space-y-2.5 my-1">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-white border flex items-center justify-center text-lg shrink-0"><i class="fa-solid fa-car"></i></div>
              <div>
                <div class="font-black text-xs text-[#2C1D12]">전용 세단/밴 픽업 (${curDuration})</div>
                <div class="text-[10px] text-gray-500 font-bold">길찾기 걱정 없는 Door-to-Door 의전</div>
              </div>
            </div>

            <div class="flex items-center justify-between gap-2 bg-[#FFF8D6] p-2 rounded-xl border border-[#F5C330]">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-[#2C1D12] text-[#FFE135] flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-user-tie"></i></div>
                <div>
                  <div class="font-black text-xs text-[#2C1D12]">청년 로컬가이드 8시간 전담 에스코트</div>
                  <div class="text-[10px] text-[#4A2E1B] font-extrabold">선택됨: ${GUIDES_LIST[curGuideIdx]}</div>
                </div>
              </div>
              <button onclick="changeGuide()" class="px-2 py-1 rounded-lg bg-[#2C1D12] text-[#FFE135] text-[10px] font-black shrink-0">
                가이드 변경 ↻
              </button>
            </div>

            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-white border flex items-center justify-center text-lg shrink-0"><i class="fa-solid fa-camera"></i></div>
              <div>
                <div class="font-black text-xs text-[#2C1D12]">스냅 사진 촬영 + 자녀 안심 실시간 카톡 리포트</div>
                <div class="text-[10px] text-gray-500 font-bold">기록으로 남기는 특별한 추억</div>
              </div>
            </div>
          </div>
        `;
      } else {
        // 기본(Basic): 청년 로컬가이드 완전 제외! (전용버스 + 맛집 예약 + 전통시장 코스로만 구성)
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="bg-[#46331F] text-[#FFE135] text-[11px] font-black px-3 py-1 rounded-full">
              가성비 단체투어 · 1~40명 대량신청 가능
            </span>
            <span class="text-xs font-black text-rose-700">실결제 ${basicUnit.toLocaleString()}원</span>

              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-white border flex items-center justify-center text-lg shrink-0"><i class="fa-solid fa-bag-shopping"></i></div>
              <div>
                <div class="font-black text-xs text-[#2C1D12]">전통시장 & 지역 명소 자유 코스</div>

    }

    function changePax(delta) {
      const maxPax = curPkgMode === 'basic' ? 40 : 6;
      const step = (curPkgMode === 'basic' && curPax >= 10 && delta > 0) ? 5 : 1;
      curPax = Math.max(1, Math.min(maxPax, curPax + (delta * step)));
      renderPackageView();
    }

    // ================= 5. 팬클럽 단체 탭 =================
    function setClubMode(mode) {
      curClubMode = mode;
      document.getElementById('cmode-member').className = mode === 'member' ? 'px-2.5 py-1.5 rounded-lg bg-[#FFE135] text-[#2C1D12]' : 'px-2.5 py-1.5 rounded-lg text-white';
      document.getElementById('cmode-mgr').className = mode === 'mgr' ? 'px-2.5 py-1.5 rounded-lg bg-[#FFE135] text-[#2C1D12]' : 'px-2.5 py-1.5 rounded-lg text-white';
      renderClubView();
    }

    function renderClubView() {
      const box = document.getElementById('club-content-box');
      if (curClubMode === 'member') {
        box.innerHTML = `
          <div class="space-y-2.5">
            <span class="bg-[#FFE135] text-[#2C1D12] text-[10px] font-black px-2.5 py-0.5 rounded">초대코드 접속: HERO-01</span>
            <h4 class="font-black text-base text-[#2C1D12]">[${curSinger}] 경남진주지부 단체버스 신청</h4>
            <input type="text" placeholder="회원 성함 또는 닉네임 입력" class="w-full p-3 rounded-xl bg-[#FDFBF3] border text-xs font-bold" />
            <div class="p-3.5 rounded-xl bg-[#FDFBF3] border flex items-center justify-between">
              <div>
                <div class="text-xs font-black">내 배정: 1호차 · 1열 02번(앞자리)</div>
                <div class="text-[10px] text-emerald-700 font-bold mt-0.5">✔ 회비 입금확인 완료 · 개인 QR 탑승권 발급</div>
              </div>
              <i class="fa-solid fa-qrcode text-3xl text-[#2C1D12]"></i>
            </div>
          </div>
          <button onclick="showToast('🎉 팬클럽 단체버스 참여 신청이 완료되었습니다!')" class="btn-bounce w-full py-3.5 rounded-xl bg-[#FFE135] text-[#2C1D12] font-black text-xs shadow-xs">
            단체버스 참여 신청 완료하기
          </button>
        `;
      } else {
        box.innerHTML = `
          <div class="space-y-2 text-xs">
            <div class="flex justify-between items-center">
              <span class="font-black text-sm">📋 총무 실시간 명단·입금 관리</span>
              <span class="text-rose-600 font-black">신청 32 / 40명</span>
            </div>
            <div class="p-3 rounded-xl bg-[#FDFBF3] border flex justify-between items-center">
              <span class="font-bold">1. 박순자 (1호차 01번)</span>
              <span class="bg-emerald-600 text-white text-[10px] font-black px-2 py-0.5 rounded">입금완료·QR✔</span>
            </div>
            <div class="p-3 rounded-xl bg-[#FDFBF3] border flex justify-between items-center">
              <span class="font-bold">2. 김영숙 (1호차 02번)</span>
              <span class="bg-emerald-600 text-white text-[10px] font-black px-2 py-0.5 rounded">입금완료·QR✔</span>
            </div>
            <div class="p-3 rounded-xl bg-[#FDFBF3] border flex justify-between items-center">
              <span class="font-bold">3. 최미경 (2호차 01번)</span>
              <span class="bg-rose-500 text-white text-[10px] font-black px-2 py-0.5 rounded">미입금</span>
            </div>
          </div>
          <button onclick="showToast('🔗 단톡방 초대 링크가 복사되었습니다!')" class="btn-bounce w-full py-3.5 rounded-xl bg-[#2C1D12] text-[#FFE135] font-black text-xs">
            🔗 단톡방 회원 초대링크 복사하기
          </button>
        `;
      }
    }

    // ================= 6. 예약 확정 & 카톡 공유 =================
    function confirmBooking() {
      const origin = document.getElementById('pkg-origin-select').value;
      const summary = document.getElementById('pkg-summary-label').innerText;
      const total = document.getElementById('pkg-total-price').innerText;
      const subText = curPkgMode === 'premium'
        ? `${origin} | ${GUIDES_LIST[curGuideIdx]}`
        : `${origin} | 전용 관광버스 단체투어 (가이드 미포함)`;

      bookings.unshift({
        code: 'PASS-' + Math.floor(1000 + Math.random() * 9000),
        title: `[${curSinger}] ${summary}`,
        sub: subText,
        price: total
      });

      document.getElementById('badge-count').innerText = bookings.length;
      openMyModal();
      showToast('🎉 예약이 확정되었습니다!');
    }

    function sendKakaoGift() {
      const total = document.getElementById('pkg-total-price').innerText;
      showToast(`💝 자녀 카카오톡으로 [${curSinger} 효도선물 결제 링크 (${total})]를 전송했습니다!`);
    }

    function openMyModal() {
      document.getElementById('my-modal-list').innerHTML = bookings.map(b => `
        <div class="p-3 rounded-2xl bg-white border border-[#ECE3C8] space-y-1">
          <div class="flex justify-between">
            <span class="bg-[#2C1D12] text-[#FFE135] text-[10px] font-black px-2 py-0.5 rounded">${b.code}</span>
            <span class="font-black text-rose-600">${b.price}</span>
          </div>
          <div class="font-black text-[#2C1D12]">${b.title}</div>
          <div class="text-[11px] text-gray-500 font-bold">${b.sub}</div>
        </div>
      `).join('');
      document.getElementById('my-modal').classList.remove('hidden');
    }

    function closeMyModal() {
      document.getElementById('my-modal').classList.add('hidden');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2600);
    }

    function renderAll() {
