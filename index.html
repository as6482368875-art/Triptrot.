                    <span className="bg-emerald-700 text-white text-xs font-black px-3 py-1 rounded-full">✔ 실제 대면 탐색조사 실측 데이터 (Fact)</span>
                    <span className="text-xs font-bold text-gray-500">조사일: 2026.10.13 | 장소: 진주 남강 일대 | 표본: 30~70대 30명</span>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200">
                      <span className="text-xs font-black text-emerald-900 block">지방 공연 방문 시 예매 불편 비율</span>
                      <span className="text-3xl font-black text-emerald-800 block mt-1">37.0%</span>
                      <span className="text-xs text-gray-600 font-bold">불편 요인 전체 1위 기록</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200">
                      <span className="text-xs font-black text-emerald-900 block">타지역 교통·이동 불편 비율</span>
                      <span className="text-3xl font-black text-emerald-800 block mt-1">33.3%</span>
                      <span className="text-xs text-gray-600 font-bold">예매+교통 장벽이 70.3% 차지</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200">
                      <span className="text-xs font-black text-emerald-900 block">공연+여행 결합 서비스 이용 의향</span>
                      <span className="text-3xl font-black text-coral block mt-1">70.4%</span>
                      <span className="text-xs text-gray-600 font-bold">‘매우 그렇다’ 긍정 응답 비율</span>
                    </div>
                  </div>
                </div>

                {/* [구분 2] 지자체 협업 시연용 시뮬레이션 지표 (방문객·숙박·소비액·제휴업체·청년일자리) */}
                <div className="bg-white p-6 rounded-3xl border-2 border-cream-border space-y-5">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <h3 className="text-xl font-black text-navy s-title">📊 지자체별 관광 유입 및 지역 소비 시뮬레이션 지표</h3>
                    <span className="bg-amber-100 text-amber-950 border border-amber-300 text-xs font-black px-3 py-1 rounded-full">
                      ⚠️ 아래 수치는 지자체 B2G 제안용 시연(Simulation) 데이터입니다
                    </span>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                    <div className="p-4 rounded-2xl bg-cream border border-cream-border">
                      <span className="text-xs font-bold text-gray-500 block">등록 관광 상품</span>
                      <span className="text-xl font-black text-navy block mt-1">12개 코스</span>
                      <span className="text-[11px] text-coral font-bold">4개 도시 체류형</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-cream border border-cream-border">
                      <span className="text-xs font-bold text-gray-500 block">지역 제휴 업체</span>
                      <span className="text-xl font-black text-navy block mt-1">48개소</span>
                      <span className="text-[11px] text-gray-600 font-bold">식당·시장·숙박·공방</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-cream border border-cream-border">
                      <span className="text-xs font-bold text-gray-500 block">유입 방문객 수</span>
                      <span className="text-xl font-black text-navy block mt-1">1,840명</span>
                      <span className="text-[11px] text-emerald-700 font-bold">타지역 유입 89%</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-cream border border-cream-border">
                      <span className="text-xs font-bold text-gray-500 block">숙박 예약 전환</span>
                      <span className="text-xl font-black text-coral block mt-1">620실</span>
                      <span className="text-[11px] text-gray-600 font-bold">체류 전환율 42%</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-cream border border-cream-border">
                      <span className="text-xs font-bold text-gray-500 block">지역 상권 소비액</span>
                      <span className="text-xl font-black text-navy block mt-1">2.4억 원</span>
                      <span className="text-[11px] text-emerald-700 font-bold">1인 평균 13만원 소비</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-cream border border-cream-border">
                      <span className="text-xs font-bold text-gray-500 block">청년 가이드 활동</span>
                      <span className="text-xl font-black text-navy block mt-1">34명 / 142건</span>
                      <span className="text-[11px] text-coral font-bold">지역 청년 일자리</span>
                    </div>
                  </div>

                  {/* 도시별 제휴 상권 및 체류 시간 비교 막대 그래프 */}
                  <div className="bg-cream p-5 rounded-2xl border border-cream-border space-y-3">
                    <h4 className="font-black text-sm text-navy">📈 일반 공연 관람객 vs TRIPTROT 체류형 관광객 지역 소비 비교 (시연 모델)</h4>
                    <div className="space-y-2 text-xs font-bold">
                      <div>
                        <div className="flex justify-between mb-1">
                          <span>기존 단순 셔틀 관람객 (평균 체류 3.5시간 · 공연만 보고 즉시 귀가)</span>
                          <span>1인 평균 지역 소비: 18,000원</span>
                        </div>
                        <div className="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
                          <div className="w-[15%] h-full bg-gray-500"></div>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between mb-1 text-coral font-black">
                          <span>TRIPTROT 체류형 관광객 (평균 체류 18.5시간 · 맛집+전통시장+지역숙박 연결)</span>
                          <span>1인 평균 지역 소비: 132,000원 (7.3배 증가)</span>
                        </div>
                        <div className="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
                          <div className="w-[88%] h-full bg-coral"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* ================= 모바일 하단 고정 빠른 메뉴 바 ================= */}
          <div className="fixed bottom-0 inset-x-0 bg-white border-t-2 border-cream-border z-30 md:hidden">
            <div className="grid grid-cols-5 text-center py-1.5">
              {[
                { key: 'home', label: '홈', icon: 'home' },
                { key: 'concert', label: '공연여행', icon: 'bus' },
                { key: 'local', label: '지역관광', icon: 'compass' },
                { key: 'guide', label: '청년가이드', icon: 'user-check' },
                { key: 'gov', label: '지자체협업', icon: 'bar-chart-3' }
              ].map(m => (
                <button
                  key={m.key}
                  onClick={() => setActiveMenu(m.key as MenuKey)}
                  className={`flex flex-col items-center py-1 ${activeMenu === m.key ? 'text-coral font-black' : 'text-gray-500 font-bold'}`}
                >
                  <Icon name={m.icon} className="w-5 h-5" />
                  <span className="text-[11px] mt-0.5">{m.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* ================= [모달 1] 시연용 예약 확인 및 QR 체크인 보관함 ================= */}
          {showResModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 shadow-2xl border-2 border-navy max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <span className="bg-coral text-white text-[11px] font-black px-2.5 py-0.5 rounded-full">실제 결제 미발생 · 시연용 바우처</span>
                    <h3 className="text-xl font-black text-navy mt-1">🎟️ 나의 예약 내역 (전화번호 보호 적용)</h3>
                  </div>
                  <button onClick={() => setShowResModal(false)} className="text-2xl font-black text-gray-400">&times;</button>
                </div>

                <div className="space-y-3 overflow-y-auto flex-1">
                  {reservations.map((r, i) => (
                    <div key={r.id} className="p-4 rounded-2xl bg-cream border border-cream-border space-y-1.5 text-xs">

                        <span className="bg-navy text-white font-black px-2.5 py-0.5 rounded-full">{r.category}</span>
                        <span className="font-mono font-bold text-gray-500">{r.id}</span>
                      </div>
                      <h4 className="font-black text-base text-navy pt-1">{r.title}</h4>
                      <p className="font-bold text-gray-700">• 예약자: {r.guestName} ({r.pax}명) / 연락처: {r.maskedPhone}</p>
                      <p className="font-bold text-gray-700">• 일시/유형: {r.date} ({r.stayType})</p>
                      <p className="font-bold text-gray-700">• 탑승장소: {r.origin}</p>
                      <p className="font-black text-emerald-700">• 상태: {r.status}</p>
                      <div className="pt-2 border-t border-cream-border flex justify-between items-center">
                        <span className="font-black text-base text-coral">{r.totalPrice}</span>
                        <button
                          onClick={() => handleShareKakao(`🎟️ [TRIPTROT 시연용 예약 바우처]\n• 상품: ${r.title} (${r.stayType})\n• 일시: ${r.date}\n• 탑승: ${r.origin}`)}
                          className="px-3 py-1.5 rounded-xl bg-[#FEE500] text-[#191919] font-black"
                        >
                          💬 카톡 공유
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setShowResModal(false)} className="w-full py-3.5 rounded-xl bg-navy text-white font-black text-sm">
                  닫기
                </button>
              </div>
            </div>
          )}

          {/* ================= [모달 2] 자녀 안심 대리예약 및 실시간 탑승 트래커 (기존 기능 보존) ================= */}
          {showChildModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 shadow-2xl border-2 border-navy max-h-[88vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <span className="bg-navy text-amber-300 text-xs font-black px-2.5 py-0.5 rounded-full">가족 안심 동행 서비스</span>
                    <h3 className="text-xl font-black text-navy mt-1">💝 자녀 대리 예약 & 실시간 부모님 동행 알림</h3>
                  </div>
                  <button onClick={() => setShowChildModal(false)} className="text-2xl font-black text-gray-400">&times;</button>
                </div>

                <div className="bg-cream p-4 rounded-2xl border border-cream-border space-y-2.5 text-xs">
                  <div className="flex justify-between items-center">
                    <span className="font-black text-sm text-navy">🔔 부모님 당일 이동 상태 (시연 시뮬레이션)</span>
                    <button
                      onClick={() => setChildStep((childStep % 4) + 1)}
                      className="px-2.5 py-1 rounded-lg bg-navy text-white font-black"
                    >
                      다음 단계 시연 ➔
                    </button>
                  </div>
                  {[
                    '1단계: 출발지 셔틀버스 안전 탑승 확인 (09:35)',
                    '2단계: 사전 예약 맛집 도착 및 중식 완료 (12:20)',
                    '3단계: 공연장 도착 및 화장실·좌석 착석 에스코트 완료 (16:30)',
                    '4단계: 공연 종료 후 귀가 차량 또는 숙소 체크인 완료 (20:10)'
                  ].map((st, idx) => (
                    <div key={idx} className={`p-2.5 rounded-xl font-bold flex items-center gap-2 ${idx < childStep ? 'bg-white border border-emerald-300 text-navy' : 'opacity-40'}`}>
                      <span className="w-5 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px]">✔</span>
                      <span>{st}</span>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => {
                    setShowChildModal(false);
                    handleCreateReservation('자녀 대리 효도예약 (1박 2일)', 149000);
                  }}
                  className="w-full py-4 rounded-xl bg-coral text-white font-black text-sm"
                >
                  [시연용] 부모님 대신 예약 등록 및 카카오톡 일정 발송
                </button>
              </div>
            </div>
          )}

          {/* 토스트 메시지 */}
          {toastMsg && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-navy text-white px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-black text-center z-50 border border-amber-300">
              {toastMsg}
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root')!);
    root.render(<App />);
  </script>
</body>
</html>
